    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/jadvalapps/apple-touch-icon.png" />

    <link rel="apple-touch-icon" sizes="512x512" href="/jadvalapps/icon-512.png" />

    <!-- Web App Manifest & Favicons -->
    <link rel="manifest" href="/jadvalapps/manifest.json" />

    <link rel="icon" type="image/png" sizes="192x192" href="/jadvalapps/icon-192.png" />

    <!-- The react-native-web recommended style reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0A0E1A;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      برای استفاده از این برنامه باید جاوااسکریپت در مرورگر فعال باشد.
